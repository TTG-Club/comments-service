spring:
  application:
    name: comment

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: comment


# Токены выпускает auth-service и подписывает симметричным HMAC-секретом.
# Тот же секрет валидирует subscriber-service (AUTH_SERVICE_JWT_SECRET) — значение общее.
# JWKS/issuer-uri здесь неприменимы: auth-service не публикует набор ключей и не проставляет claim iss.
auth-service:
  jwt-secret: ${AUTH_SERVICE_JWT_SECRET}

# Общий секрет межсервисных вызовов /api/v1/internal/** (их дёргает auth-service при блокировке
# и разблокировке пользователя). Значение должно совпадать с настроенным на стороне auth-service.
# Пустое значение по умолчанию — fail-closed: не сконфигурированный секрет закрывает внутренние
# ручки полностью (401), а не открывает их для всех.
internal:
  service-secret: ${INTERNAL_SERVICE_SECRET:}

# Антиспам на создание комментариев и ответов, на пользователя.
# intervals — минимальный промежуток между комментариями по мере роста серии нарушений:
# сначала 20с, после первого нарушения 60с, после следующего вместо очередного ужесточения
# выдаётся бан на block-duration. Через violation-decay без нарушений серия обнуляется.
comments:
  rate-limit:
    enabled: ${COMMENTS_RATE_LIMIT_ENABLED:true}
    intervals:
      - 20s
      - 60s
    block-duration: 3h
    violation-decay: 1h


# core-api — каталог сайта 2024. Отсюда сервис берёт прежние адреса записей
# (GET /api/internal/url-history, заголовок X-Service-Token = internal.service-secret)
# и переносит обсуждения на новый адрес страницы после смены акронима источника.
# Пустой CORE_API_URL выключает синхронизацию: сервис работает, но без переноса.
core-api:
  base-url: ${CORE_API_URL:}
  connect-timeout: ${CORE_API_CONNECT_TIMEOUT:2s}
  read-timeout: ${CORE_API_READ_TIMEOUT:10s}
  url-history:
    sync-interval: ${URL_HISTORY_SYNC_INTERVAL:5m}
    overlap: 10m
